name: CI Pipeline - Student Placement API

"on":
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Verify Required Files Exist
        run: |
          echo "Verifying required project artifacts..."
          REQUIRED_FILES=(
            "model.joblib"
            "main.py"
            "requirements.txt"
            "Dockerfile"
            ".dockerignore"
            ".gitignore"
            "README.md"
            "pytest.ini"
            "tests/test_api.py"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "CRITICAL: Required file '$file' is missing!"
              exit 1
            fi
            echo "✓ Found: $file"
          done
          echo "All required files verified successfully."

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v --tb=short

  docker-build:
    name: Build & Smoke-Test Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t student-placement-api:latest .

      - name: Smoke Test Container Runtime
        run: |
          # Start container in detached mode
          docker run -d --name student-placement-container -p 8000:8000 student-placement-api:latest

          echo "Waiting for container and FastAPI service to be ready..."
          READY=0
          for i in {1..15}; do
            if curl -s -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✓ API responded to healthcheck on attempt $i."
              READY=1
              break
            fi
            echo "Waiting for service... (attempt $i/15)"
            sleep 2
          done

          if [ $READY -ne 1 ]; then
            echo "CRITICAL: Container failed to respond to /health within 30 seconds."
            echo "--- Container Logs ---"
            docker logs student-placement-container
            exit 1
          fi

          # Output full health response for CI log verification
          RESPONSE=$(curl -s http://localhost:8000/health)
          echo "Health check response: $RESPONSE"

          # Clean up container
          docker stop student-placement-container
